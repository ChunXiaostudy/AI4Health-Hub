name: Update & Deploy
on:
  schedule:
    - cron: "30 23 * * *"   # daily 07:30 Beijing time
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install feedparser
      - name: Unit tests
        run: python tests/test_hub.py
      - name: Fetch, summarize, build
        run: python hub.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-v4-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          MAX_NEW: "200"
      - name: Source health alert (0 items for 3+ runs)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -s data/alerts.md ]; then
            n=$(gh issue list --state open --search "in:title 数据源告警" --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body-file data/alerts.md; else gh issue create --title "数据源告警：来源连续为 0" --body-file data/alerts.md; fi
          fi
      - name: Commit data
        run: |
          bash .github/scripts/push-data.sh "data: $(date -u +%F)"
      - uses: actions/configure-pages@v6
      # since v4 the artifact drops dotfiles by default; keep site/.nojekyll in it
      - uses: actions/upload-pages-artifact@v5
        with: { path: site, include-hidden-files: true }
      # The Pages backend now and then rejects a deployment outright ("Deployment failed, try again later.") with no cause;
      # asking again a minute later goes through, so retry before the run is failed.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
