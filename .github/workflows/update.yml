name: Update & Deploy
on:
  schedule:
    - cron: "30 23 * * *"   # daily 07:30 Beijing time
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser
      - name: Unit tests
        run: python tests/test_hub.py
      - name: Fetch, summarize, build
        run: python hub.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-v4-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          MAX_NEW: "80"
      - name: Source health alert (0 items for 3+ runs)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -s data/alerts.md ]; then
            n=$(gh issue list --state open --search "in:title 数据源告警" --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body-file data/alerts.md; else gh issue create --title "数据源告警：来源连续为 0" --body-file data/alerts.md; fi
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
