<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{{HEAD}}<style>
.health{--bg:#F6F8F7;--sf:#FFFFFF;--tx:#14201C;--mu:#5B6B65;--bd:#E3E9E6;--ac:#0E8A6E;--ac2:#2F6FDB;--acr:14,138,110;--ac2r:47,111,219}
.apps{--bg:#FBF8F3;--sf:#FFFFFF;--tx:#1F1B16;--mu:#6E665C;--bd:#ECE5DA;--ac:#FF6A3D;--ac2:#7A5AF8;--acr:255,106,61;--ac2r:122,90,248}
@media (prefers-color-scheme:dark){
.health{--bg:#0C1210;--sf:#131B18;--tx:#E6EEEA;--mu:#8FA19A;--bd:#1F2A26;--ac:#34C79E;--acr:52,199,158}
.apps{--bg:#14110E;--sf:#1D1915;--tx:#F3EEE7;--mu:#A39A8E;--bd:#2A241E;--ac:#FF8A64;--acr:255,138,100}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.65 "Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif}
a{color:inherit;text-decoration:none}.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}@media(max-width:640px){.wrap{padding:0 16px}}
header{position:sticky;top:0;z-index:10;height:56px;border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 85%,transparent)}
header .wrap{display:flex;align-items:center;gap:20px;height:56px}.brand{font-size:20px;font-weight:600;white-space:nowrap}.brand b{color:var(--ac);font-weight:600}

@media(min-width:900px){body{padding-left:208px}
.side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:208px;padding:18px 14px 20px;border-right:1px solid var(--bd);background:var(--bg);z-index:20}
.side .brand{display:block;padding:0 10px 24px;line-height:24px}.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px}.snav svg{width:18px;height:18px}
.snav a:hover{background:rgba(var(--acr),.06);color:var(--tx)}.snav a.on{background:rgba(var(--acr),.1);color:var(--ac)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 10px;font-size:12px;color:var(--mu)}.sfoot a:hover{color:var(--ac)}
header .brand{display:none}header.notabs{display:none}}
@media(max-width:899px){body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}

.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;font-size:11px}.bnav svg{width:21px;height:21px}.bnav a.on{color:var(--ac)}}
@media(max-width:640px){.card .meta{flex-wrap:wrap;row-gap:2px}.card .meta span{white-space:nowrap}}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:32px 0 20px;flex-wrap:wrap}h1{font-size:28px;font-weight:700;line-height:1.25;margin:0}
.hero p{margin:4px 0 0;color:var(--mu)}.pill{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:999px;padding:6px 14px;font:500 13px inherit;font-family:inherit;cursor:pointer}
h2{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mu);margin:28px 0 12px;text-transform:uppercase}
.feed{display:flex;flex-direction:column;gap:12px}.day{position:sticky;top:56px;z-index:5;background:var(--bg);padding:12px 0 8px;margin:16px 0 0;font:500 12px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.02em;color:var(--mu)}
.card{display:block;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
.card:hover{border-color:rgba(var(--acr),.3);transform:translateY(-1px)}.card.reg{border-left:3px solid var(--ac)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mu)}.meta img{width:16px;height:16px;border-radius:3px}
.badge{margin-left:auto;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:0 6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{color:var(--mu);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kp{margin:6px 0 0;padding-left:18px;color:var(--mu);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{height:22px;line-height:22px;border-radius:999px;padding:0 8px;font-size:12px;background:rgba(var(--acr),.1);color:var(--ac)}
.chip.p{background:rgba(var(--ac2r),.1);color:var(--ac2)}.chip.w{background:none;border:1px solid var(--bd);color:var(--mu);line-height:20px}
.why{font-size:14px;font-style:italic;color:var(--mu);margin-top:8px}
.row{display:flex;gap:14px}.ico{flex:0 0 48px;width:48px;height:48px;border-radius:12px;object-fit:cover;background:rgba(var(--acr),.1);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.row .body{min-width:0;flex:1}
.feat{display:flex;gap:20px;padding:0}.feat .img{flex:0 0 40%;min-height:220px;background:rgba(var(--acr),.1) center/cover;display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:44px;font-weight:700}
.feat .txt{padding:22px 22px 22px 0}.feat .t{font-size:22px}.feat .s{-webkit-line-clamp:4}
@media(max-width:720px){.feat{flex-direction:column}.feat .txt{padding:0 18px 18px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.grid .card{padding:0}.shot{aspect-ratio:16/9;border-radius:14px 14px 0 0;background:rgba(var(--acr),.1) center/cover;display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:40px;font-weight:700}
.grid .inner{padding:16px 20px 18px}
.sk{height:120px;border-radius:14px;background:#00000008;margin-bottom:12px}
.mini{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:12px}
footer{border-top:1px solid var(--bd);margin-top:48px;padding:24px 0 40px;font-size:12px;color:var(--mu)}footer a{color:var(--ac)}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}.sub button{border:1px solid var(--bd);background:var(--sf);color:var(--mu);border-radius:999px;height:28px;padding:0 12px;font:500 12px inherit;font-family:inherit;cursor:pointer}.sub button.on{border-color:var(--ac);color:var(--ac)}
.empty{color:var(--mu);padding:24px 0}

.card .stretch{color:inherit;text-decoration:none;display:-webkit-box}.card .stretch::after{content:"";position:absolute;inset:0;z-index:0}
.card .chip.tag,.card .also a,.card .cite,.card .meta img{position:relative;z-index:1}
.chip.tag{border:0;cursor:pointer;font-family:inherit}.chip.tag:hover{background:rgba(var(--acr),.18)}
.orig{font-size:12px;color:var(--mu);margin:-2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.also{font-size:12px;color:var(--mu);margin-top:8px}.also a{color:var(--ac);margin-right:8px}
.cite{margin-top:8px;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;font:500 12px inherit;font-family:inherit;padding:2px 8px;cursor:pointer}.cite:hover{color:var(--ac);border-color:var(--ac)}
.feat .img.logo{flex-direction:column;gap:8px;font-size:15px;font-weight:600;background:rgba(var(--acr),.06);flex-basis:30%}.feat .img.logo img{width:48px;height:48px;border-radius:10px}.feat .img.logo .ev{font-size:12px;font-weight:500;color:var(--mu)}
.feat .img.scorecard{flex:0 0 30%;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:24px 26px;font-size:14px;font-weight:500;color:var(--tx);background:rgba(var(--acr),.06);text-align:left}.scorecard .big{display:flex;align-items:baseline;gap:4px;color:var(--ac);line-height:1}.scorecard .big b{font-size:56px;font-weight:700;letter-spacing:-.02em}.scorecard .big span{font-size:16px;color:var(--mu)}.scorecard .tn{font-size:16px;font-weight:700;color:var(--ac)}.scorecard .ev{font-size:12px;color:var(--mu)}.scorecard .rs{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--tx);border-top:1px solid var(--bd);padding-top:10px}.scorecard.hi{background:rgba(var(--acr),.12)}.scorecard.mid .big,.scorecard.mid .tn{color:var(--ac2)}.scorecard.lo .big,.scorecard.lo .tn{color:var(--mu)}.scorecard.lo{background:rgba(var(--acr),.03)}.chip.sc{font-weight:600;cursor:help;position:relative;z-index:1}.chip.sc.hi{background:var(--ac);color:#fff}.chip.sc.mid{background:rgba(var(--ac2r),.12);color:var(--ac2)}.chip.sc.lo{background:none;border:1px solid var(--bd);color:var(--mu);line-height:20px}@media(max-width:720px){.feat .img.scorecard{flex-basis:auto;width:100%;min-height:0;padding:18px}.scorecard .big b{font-size:40px}}
.card .ext{position:relative;z-index:1;margin-left:auto;font-size:12px;color:var(--mu);text-decoration:none;white-space:nowrap}.card .ext:hover{color:var(--ac)}.item .back{display:inline-block;margin:20px 0 8px;font-size:13px;color:var(--mu);text-decoration:none}.item .back:hover{color:var(--ac)}.igrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:start}.imain h1{font-size:28px;line-height:1.35;margin:10px 0 6px}.imain .orig{color:var(--mu);font-size:14px;margin-bottom:8px}.imain h2{font-size:13px;font-weight:700;color:var(--ac);margin:24px 0 8px;letter-spacing:.02em}.imain p{font-size:16px;line-height:1.85;margin:0 0 12px}.imain .abs p b{color:var(--ac)}.imain .kp li{font-size:15px;line-height:1.8}.imain .note{font-size:12px;margin-top:28px}.orig-abs{margin-top:8px;font-size:13px;color:var(--mu)}.orig-abs summary{cursor:pointer}.orig-abs p{font-size:14px!important;line-height:1.7!important;color:var(--mu)}.iside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}.iside .btn{display:block;text-align:center;padding:11px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;text-decoration:none}.iside .btn:hover{opacity:.9}.iside .box{border:1px solid var(--bd);border-radius:12px;padding:16px;background:var(--sf)}.iside .scorecard{display:flex;flex-direction:column;gap:4px}.iside .scorecard .big b{font-size:44px}.iside .scorecard .rs{margin:6px 0 0}.iside .scorecard .ev{margin-top:8px;font-size:11px;line-height:1.5}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-all}.kv a{color:var(--ac)}.iside .cite{align-self:flex-start}.item .relh{font-size:15px;margin:40px 0 12px}@media(max-width:820px){.igrid{grid-template-columns:minmax(0,1fr)}.item .meta{flex-wrap:wrap}.iside{position:static;order:-1}.imain h1{font-size:23px}}
.big{padding:0}.big .inner{padding:16px 20px 18px}
.tools{display:flex;gap:10px;align-items:center;margin:0 0 8px}.tools input{flex:1;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);padding:0 12px;font:400 14px inherit;font-family:inherit}
.tools input:focus{outline:none;border-color:var(--ac)}.tagf{font-size:12px;color:var(--ac);cursor:pointer;border:1px solid var(--ac);border-radius:999px;padding:2px 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.filters select{height:30px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:400 13px inherit;font-family:inherit}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:16px 0;font-size:13px;color:var(--mu)}.pager button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:4px 12px;cursor:pointer}
.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}.list a{display:block;padding:12px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px}.list a:hover{border-color:var(--ac)}
.prose p{margin:0 0 12px}.prose a{color:var(--ac)}.refs{padding-left:0;list-style:none;font-size:14px}.muted{color:var(--mu)}
table.st{border-collapse:collapse;font-size:13px;width:100%}table.st td,table.st th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}td.bad{color:#d33}
[hidden]{display:none!important}
</style></head><body class="{{MODE}}">{{BODY}}<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sec='全部',q='',tag='',form='全部形式',C=null,page=0;const PER=30;
document.addEventListener('click',e=>{const t=e.target.closest('.chip.tag');if(t){e.preventDefault();tag=t.dataset.tag;page=0;apply();window.scrollTo({top:0,behavior:'smooth'});return}
 const c=e.target.closest('.cite');if(c){e.preventDefault();navigator.clipboard&&navigator.clipboard.writeText(c.dataset.cite).then(()=>{const o=c.textContent;c.textContent='已复制';setTimeout(()=>c.textContent=o,1200)});}});
$$('.tab').forEach(b=>b.onclick=()=>{sec=b.dataset.s;$$('.tab').forEach(x=>x.classList.toggle('on',x===b));page=0;apply()});
const qi=$('#q');if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();page=0;apply()};
const tf=$('#tagf');if(tf)tf.onclick=()=>{tag='';apply()};
const setForm=f=>{form=f;$$('#formBar button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))};
$$('#formBar button').forEach(b=>b.onclick=()=>{setForm(b.dataset.f);page=0;apply()});
const rnd=$('#rnd');if(rnd)rnd.onclick=()=>{const a=$$('#feed article .stretch');if(a.length)window.open(a[Math.floor(Math.random()*a.length)].href,'_blank','noopener')};
const H=new URLSearchParams(location.hash.slice(1));if(H.get('tab')){sec=H.get('tab');$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.s===sec))}if(H.get('form'))setForm(H.get('form'));if(H.get('sub')==='conf'&&$('#feed'))location.replace('papers/');
function match(el){return (sec==='全部'||el.dataset.sec===sec)&&(form==='全部形式'||el.dataset.form===form)&&(!q||el.dataset.text.includes(q))&&(!tag||el.dataset.tags.split('|').includes(tag))}
function apply(){const fw=$('#featWrap');if(fw)fw.hidden=!!(sec!=='全部'||form!=='全部形式'||q||tag);
 if(tf){tf.hidden=!tag;tf.textContent='标签：'+tag+' ✕'}
 const cp=$('#confPanel'),feed=$('#feed');
 const conf=!!cp&&!feed;let n=0;
 if(conf){loadConf();n=1}else{$$('#feed .dayg').forEach(g=>{let k=0;const fv=fw&&!fw.hidden;g.querySelectorAll('article').forEach(a=>{const m=match(a)&&!(fv&&a.dataset.top);a.hidden=!m;k+=m});g.hidden=!k;const s=g.querySelector('.n');if(s)s.textContent=k;n+=k})}
 const em=$('#empty');if(em)em.hidden=!!n}
function loadConf(){if(C){renderConf();return}$('#confPanel').innerHTML='<div class="sk"></div><div class="sk"></div>';
 fetch($('#confPanel').dataset.src||'conf.json').then(r=>r.json()).then(d=>{C=d;const cs=[...new Set(d.map(x=>x.c))].sort(),ys=[...new Set(d.map(x=>String(x.y)))].sort().reverse(),ts=[...new Set(d.flatMap(x=>x.tg))].sort();
  const opt=(id,all,xs)=>`<select id="${id}"><option value="">${all}</option>${xs.map(x=>`<option>${E(x)}</option>`).join('')}</select>`;
  $('#confPanel').innerHTML=`<div class="filters">${opt('fc','全部会议',cs)}${opt('fy','全部年份',ys)}${opt('ft','全部标签',ts)}<span class="muted" id="fn" style="font-size:12px;align-self:center"></span></div><div class="feed" id="cl"></div><div class="pager" id="pg"></div>`;
  ['fc','fy','ft'].forEach(i=>$('#'+i).onchange=()=>{page=0;renderConf()});renderConf()}).catch(()=>{$('#confPanel').innerHTML='<div class="empty">加载失败</div>'})}
// cards are pre-rendered by hub.card() at build time (x.h) — same markup as the daily feed
function renderConf(){const fc=$('#fc').value,fy=$('#fy').value,ft=$('#ft').value||tag;
 const L=C.filter(x=>(sec==='全部'||x.sec===sec)&&(!fc||x.c===fc)&&(!fy||String(x.y)===fy)&&(!ft||x.tg.includes(ft))&&(!q||x.q.includes(q)));
 const P=Math.max(1,Math.ceil(L.length/PER));page=Math.min(page,P-1);$('#fn').textContent=`共 ${L.length} 篇`;
 $('#cl').innerHTML=L.slice(page*PER,(page+1)*PER).map(x=>x.h).join('')||'<div class="empty">没有匹配的论文</div>';
 $('#pg').innerHTML=`<button id="pp" ${page?'':'disabled'}>上一页</button><span class="mono">${page+1} / ${P}</span><button id="pn" ${page<P-1?'':'disabled'}>下一页</button>`;
 $('#pp').onclick=()=>{page--;renderConf();$('#confPanel').scrollIntoView()};$('#pn').onclick=()=>{page++;renderConf();$('#confPanel').scrollIntoView()}}
apply();
})();
</script></body></html>
